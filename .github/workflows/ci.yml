name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (shared on JVM and JS, server, web)
        run: ./gradlew check

  # Real Chrome against the real server jar: the whole app, the service worker, and an axe-core check of every page
  # (WCAG 2.2 A and AA). See tools/browser-e2e/README.md.
  browser:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the server jar and the web client
        run: ./gradlew :server:shadowJar :web:stampWorker
      - name: Install the browser-check dependencies
        working-directory: tools/browser-e2e
        run: npm ci --no-audit --no-fund
      - name: Whole app in two and three Chrome profiles, with axe on every page
        working-directory: tools/browser-e2e
        run: A11Y=1 node e2e.mjs
      - name: Service worker life cycle
        working-directory: tools/browser-e2e
        run: node sw-e2e.mjs
      - name: Saving a name while the first sync is between push and pull
        working-directory: tools/browser-e2e
        run: node sync-gap-e2e.mjs
